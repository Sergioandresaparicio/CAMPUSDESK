# Development - PostgreSQL
server.port=8051

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/campusDESK}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# The user table retains its name and is quoted because USER is a reserved word.
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Initial Superadministrator for development (Full access to all platform features)
app.bootstrap.enabled=${BOOTSTRAP_SUPERADMIN_ENABLED:true}
app.bootstrap.username=${SUPERADMIN_USERNAME:superadmin}
app.bootstrap.email=${SUPERADMIN_EMAIL:superadmin@localhost}
app.bootstrap.password=${SUPERADMIN_PASSWORD:SuperAdmin123!}

# Initial Administrator for development (Ticket assignment, reassignment, user & tech management)
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.username=${ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@localhost}
app.bootstrap.admin.password=${ADMIN_PASSWORD:Admin123!}

# JWT configuration (HMAC256). Environment variables allow overriding values.
security.jwt.secret=${JWT_SECRET:0fb5a8994cde705e2f45ca46921f00bffa60fdcb17ee9eecbcfed06574fa38d7}
security.jwt.issuer=${JWT_ISSUER:0fb5a8994cde705e2f45ca46921f00bffa60fdcb17ee9eecbcfed06574fa38d7}
# Duration: 30m = 30 minutes, 8h = 8 hours, 15d = 15 days; also supports ISO-8601.
security.jwt.expiration=${JWT_EXPIRATION:15d}
